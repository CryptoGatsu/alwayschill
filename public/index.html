<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>😎 CHILL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(to bottom, #4facfe, #00f2fe);
}

/* HERO */
.hero {
  height: 100vh;
  background:
    linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)),
    url('/beach.png') center/cover no-repeat;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

h1 { font-size: 4rem; }

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  padding: 40px;
}

.card {
  background: rgba(0,0,0,0.35);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
}

/* BUTTON */
button {
  padding: 12px 24px;
  border: none;
  border-radius: 10px;
  background: black;
  color: white;
  cursor: pointer;
  margin: 5px;
}

/* IMAGE */
#pfpImage {
  max-width: 300px;
  border-radius: 12px;
  margin-top: 20px;
  transition: opacity 0.3s;
}

/* EMOJI RAIN */
.emoji {
  position: fixed;
  top: -50px;
  font-size: 2rem;
  animation: fall linear forwards;
}

@keyframes fall {
  to { transform: translateY(110vh); }
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <h1>😎 CHILL</h1>
  <p>not trying. still winning.</p>
  <button onclick="rainEmojis()">tap 😎</button>
</div>

<!-- GRID -->
<div class="grid">
  <div class="card"><h3>Why 😎</h3><p>effortless dominance</p></div>
  <div class="card"><h3>Usage</h3><p>millions daily</p></div>
  <div class="card"><h3>Token</h3><p>already viral</p></div>
  <div class="card"><h3>Vibe</h3><p>just chill</p></div>
  <div class="card"><h3>Supply</h3><p>1B $CHILL</p></div>
  <div class="card"><h3>Launch</h3><p>fair launch</p></div>
  <div class="card"><h3>Liquidity</h3><p>bonding curve</p></div>
  <div class="card"><h3>Taxes</h3><p>0%</p></div>
</div>

<!-- GENERATOR -->
<div style="text-align:center; padding:40px;">
  <h2>PFP Generator 😎</h2>

  <button onclick="generatePFP()">Generate</button>
  <button onclick="downloadImage()">Download</button>

  <p id="status"></p>

  <img id="pfpImage" />

  <div id="traits"></div>
</div>

<!-- COMMUNITY -->
<div style="padding:40px;">
  <h2 style="text-align:center;">Community</h2>
  <iframe src="https://x.com/i/communities/2038577284320489664"
    style="width:100%; height:600px; border:none;"></iframe>
</div>

<script>

/* EMOJI RAIN */
function rainEmojis() {
  for (let i = 0; i < 40; i++) {
    const e = document.createElement("div");
    e.className = "emoji";
    e.innerText = "😎";
    e.style.left = Math.random() * 100 + "vw";
    e.style.animationDuration = (Math.random()*2+3)+"s";
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),5000);
  }
}

/* TRAITS */
function randomTraits() {
  const hats = ["cap", "crown", "none", "helmet"];
  const outfits = ["hoodie", "armor", "suit", "beachwear"];
  const backgrounds = ["sunset", "neon", "ocean", "space"];

  return {
    hat: hats[Math.floor(Math.random()*hats.length)],
    outfit: outfits[Math.floor(Math.random()*outfits.length)],
    background: backgrounds[Math.floor(Math.random()*backgrounds.length)]
  };
}

/* GENERATE */
async function generatePFP() {
  const status = document.getElementById("status");
  const img = document.getElementById("pfpImage");
  const traitsDiv = document.getElementById("traits");

  status.innerText = "Generating...";
  img.style.opacity = 0.3;

  const traits = randomTraits();

  try {
    const res = await fetch("/api/generate");
    const data = await res.json();

    if (data.error) {
      status.innerText = "Error: " + data.error;
      console.log(data);
      return;
    }

    img.src = data.image;
    img.style.opacity = 1;

    status.innerText = "Done 😎";

    traitsDiv.innerHTML = `
      <p>Hat: ${traits.hat}</p>
      <p>Outfit: ${traits.outfit}</p>
      <p>Background: ${traits.background}</p>
    `;

  } catch (err) {
    status.innerText = "Something broke";
    console.error(err);
  }
}

/* DOWNLOAD */
function downloadImage() {
  const img = document.getElementById("pfpImage").src;

  if (!img) {
    alert("Generate first 😎");
    return;
  }

  const a = document.createElement("a");
  a.href = img;
  a.download = "chill-pfp.png";
  a.click();
}

</script>

</body>
</html>
