<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>😎 CHILL</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Fredoka', sans-serif;
  background: linear-gradient(to bottom, #4facfe, #00f2fe);
  cursor: url('https://twemoji.maxcdn.com/v/latest/72x72/1f60e.png'), auto;
}

/* FLOATING BUTTON */
.generate-btn {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: black;
  color: white;
  padding: 20px;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(0,0,0,0.6);
  transition: 0.3s;
}

.generate-btn:hover {
  transform: scale(1.1);
}

/* LOADING INSIDE BUTTON */
.loading-text {
  font-size: 14px;
}

/* POPUP */
.popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: white;
  color: black;
  padding: 20px;
  border-radius: 20px;
  display: none;
  text-align: center;
  z-index: 1000;
}

.popup img {
  max-width: 300px;
  border-radius: 12px;
}

/* BACKDROP */
.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  display: none;
  top: 0;
  left: 0;
}
</style>
</head>

<body>

<h1 style="text-align:center; margin-top:100px;">😎 CHILL</h1>

<!-- FLOATING BUTTON -->
<div class="generate-btn" onclick="generatePFP()" id="genBtn">
  <span id="btnText">Generate 😎</span>
</div>

<!-- POPUP -->
<div class="overlay" id="overlay"></div>

<div class="popup" id="popup">
  <img id="pfpImage">
  <div id="traits"></div>
  <button onclick="downloadImage()">Download</button>
</div>

<script>

function randomTraits() {
  const hats = ["gold crown", "anime hair", "cyber helmet"];
  const outfits = [
    "anime streetwear",
    "futuristic armor",
    "fantasy knight",
    "NBA jersey",
    "superhero suit"
  ];
  const backgrounds = ["neon city", "space", "sunset beach"];

  return {
    hat: hats[Math.floor(Math.random()*hats.length)],
    outfit: outfits[Math.floor(Math.random()*outfits.length)],
    background: backgrounds[Math.floor(Math.random()*backgrounds.length)]
  };
}

async function generatePFP() {
  const btn = document.getElementById("btnText");

  btn.innerText = "CHILL...";

  const traits = randomTraits();

  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(traits)
    });

    const data = await res.json();

    document.getElementById("pfpImage").src = data.image;

    document.getElementById("traits").innerHTML = `
      <p>Hat: ${traits.hat}</p>
      <p>Outfit: ${traits.outfit}</p>
      <p>Background: ${traits.background}</p>
    `;

    document.getElementById("overlay").style.display = "block";
    document.getElementById("popup").style.display = "block";

    btn.innerText = "Generate 😎";

  } catch (err) {
    btn.innerText = "Error";
  }
}

function downloadImage() {
  const img = document.getElementById("pfpImage").src;
  const a = document.createElement("a");
  a.href = img;
  a.download = "chill.png";
  a.click();
}

</script>

</body>
</html>
