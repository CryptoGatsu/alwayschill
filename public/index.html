<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>😎 CHILL</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Fredoka', sans-serif;
  background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)),
              url('/beach.png') center/cover no-repeat;
  color: white;
  cursor: url('https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f60e.png') 16 16, auto;
}

/* HEADER */
h1 {
  text-align: center;
  margin-top: 60px;
  font-size: 3rem;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  padding: 40px;
}

.card {
  background: rgba(0,0,0,0.4);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
}

/* FLOAT BUTTON */
.generate-btn {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 170px;
  height: 55px;
  border-radius: 30px;
  overflow: hidden;
  background: black;
  box-shadow: 0 0 25px rgba(0,0,0,0.7);
  cursor: pointer;
}

.loading-fill {
  width: 0%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(90deg,#00f2fe,#4facfe);
  color: black;
  font-weight: bold;
}

/* POPUP */
.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  display: none;
  top: 0;
}

.popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: white;
  color: black;
  padding: 25px;
  border-radius: 20px;
  display: none;
  text-align: center;
}

.popup img {
  max-width: 300px;
  border-radius: 12px;
}

.popup button {
  margin: 5px;
  padding: 10px 15px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>😎 CHILL</h1>

<!-- GRID -->
<div class="grid">
  <div class="card"><h3>😎 Why Chill</h3><p>Universal symbol of effortless winning.</p></div>
  <div class="card"><h3>🌍 Usage</h3><p>Millions daily. Global vibe.</p></div>
  <div class="card"><h3>🪙 Token</h3><p>Already viral. Now tradable.</p></div>
  <div class="card"><h3>🧠 Vibe</h3><p>No roadmap. Just chill.</p></div>
  <div class="card"><h3>📦 Supply</h3><p>1B $CHILL</p></div>
  <div class="card"><h3>🚀 Launch</h3><p>Fair launch. No insiders.</p></div>
  <div class="card"><h3>💧 Liquidity</h3><p>Bonding curve.</p></div>
  <div class="card"><h3>💸 Taxes</h3><p>0% always.</p></div>
</div>

<!-- GENERATE BUTTON -->
<div class="generate-btn" onclick="generatePFP()">
  <div class="loading-fill" id="loadingFill">Generate 😎</div>
</div>

<!-- POPUP -->
<div class="overlay" id="overlay"></div>

<div class="popup" id="popup">
  <img id="pfpImage">
  <div id="traits"></div>

  <button onclick="downloadImage()">Download</button>
  <button onclick="shareImage()">Share</button>
  <button onclick="closePopup()">Close</button>
</div>

<script>

let isLoading = false;

const chillWords = [
  "chill","vibing","coolin","zen","relaxed",
  "tranquilo","relajado","calm","breezy",
  "気楽","无压力","floating"
];

function randomTraits() {
  const hats = ["anime hair","gold crown","cyber helmet"];
  const outfits = ["superhero suit","futuristic armor","samurai outfit","NBA jersey"];
  const backgrounds = ["space","neon city","sunset beach"];

  return {
    hat: hats[Math.floor(Math.random()*hats.length)],
    outfit: outfits[Math.floor(Math.random()*outfits.length)],
    background: backgrounds[Math.floor(Math.random()*backgrounds.length)]
  };
}

/* LOADING WORDS */
function startWordCycle() {
  const bar = document.getElementById("loadingFill");
  return setInterval(()=>{
    bar.innerText = chillWords[Math.floor(Math.random()*chillWords.length)];
  },400);
}

/* GENERATE */
async function generatePFP() {
  if (isLoading) return;
  isLoading = true;

  const bar = document.getElementById("loadingFill");
  bar.style.width = "100%";

  const wordCycle = startWordCycle();
  const traits = randomTraits();

  try {
    const res = await fetch("/api/generate", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(traits)
    });

    const data = await res.json();

    clearInterval(wordCycle);
    bar.innerText = "DONE 😎";

    document.getElementById("pfpImage").src = data.image;

    document.getElementById("traits").innerHTML = `
      <p>Hat: ${traits.hat}</p>
      <p>Outfit: ${traits.outfit}</p>
      <p>Background: ${traits.background}</p>
    `;

    document.getElementById("overlay").style.display = "block";
    document.getElementById("popup").style.display = "block";

  } catch (err) {
    clearInterval(wordCycle);
    bar.innerText = "try again 😎";
  }

  setTimeout(()=>{
    bar.style.width = "0%";
    bar.innerText = "Generate 😎";
    isLoading = false;
  },1500);
}

/* CLOSE */
function closePopup() {
  document.getElementById("overlay").style.display = "none";
  document.getElementById("popup").style.display = "none";
}

document.getElementById("overlay").addEventListener("click", closePopup);

/* DOWNLOAD */
function downloadImage() {
  const img = document.getElementById("pfpImage").src;
  const a = document.createElement("a");
  a.href = img;
  a.download = "chill.png";
  a.click();
}

/* SHARE */
function shareImage() {
  const text = encodeURIComponent("I just generated a 😎 Chill PFP");
  const url = encodeURIComponent(window.location.href);

  window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, "_blank");
}

</script>

</body>
</html>
