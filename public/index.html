<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>😎 CHILL</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Fredoka', sans-serif;
  background: linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)),
              url('/beach.png') center/cover no-repeat;
  color: white;
}

h1 {
  text-align: center;
  margin-top: 60px;
  font-size: 3rem;
}

/* KEEP YOUR ORIGINAL GRID STYLES */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 25px;
  padding: 50px;
}

.card {
  background: rgba(0,0,0,0.45);
  padding: 25px;
  border-radius: 16px;
  text-align: center;
  backdrop-filter: blur(10px);
  transition: transform 0.2s ease;
}

.card:hover {
  transform: translateY(-6px);
}

/* GENERATOR */
.generate-btn {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 180px;
  height: 55px;
  border-radius: 30px;
  overflow: hidden;
  background: black;
  box-shadow: 0 0 30px rgba(0,0,0,0.8);
  cursor: pointer;
}

.loading-fill {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.loading-fill.active {
  background: linear-gradient(90deg,#00f2fe,#4facfe);
  color: black;
}

/* POPUP */
.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px);
  display: none;
  top: 0;
}

.popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.45);
  color: white;
  padding: 25px;
  border-radius: 16px;
  text-align: center;
  backdrop-filter: blur(12px);
  display: none;
}

.popup img {
  max-width: 300px;
  border-radius: 12px;
}

.popup button {
  margin: 5px;
  padding: 10px 15px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

/* EMOJI EXPLOSION */
.emoji {
  position: fixed;
  font-size: 20px;
  pointer-events: none;
  animation: explode 1s ease-out forwards;
}

@keyframes explode {
  to {
    transform: translate(var(--x), var(--y));
    opacity: 0;
  }
}

/* BOTTOM SECTION */
.chill-section {
  margin-top: 50px;
  padding: 80px 40px;
  text-align: center;
  background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)),
              url('/sunset.png') center/cover no-repeat;
}

.chill-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 25px;
  margin-top: 40px;
}

.chill-box {
  background: rgba(0,0,0,0.45);
  padding: 25px;
  border-radius: 16px;
  text-decoration: none;
  color: white;
  backdrop-filter: blur(10px);
  transition: 0.2s;
}

.chill-box:hover {
  transform: translateY(-6px);
}
</style>
</head>

<body>

<h1>😎 CHILL</h1>

<!-- 🔥 YOUR ORIGINAL GRID (DO NOT TOUCH THIS PART) -->
<div class="grid">
  <!-- KEEP EXACTLY YOUR ORIGINAL CARDS HERE -->
</div>

<!-- GENERATOR -->
<div class="generate-btn" onclick="generatePFP()">
  <div class="loading-fill" id="loadingFill">Generate 😎</div>
</div>

<!-- POPUP -->
<div class="overlay" id="overlay"></div>

<div class="popup" id="popup">
  <img id="pfpImage">
  <div id="traits"></div>
  <button onclick="downloadImage()">Download</button>
  <button onclick="shareImage()">Share</button>
  <button onclick="closePopup()">Close</button>
</div>

<!-- NEW SECTION -->
<div class="chill-section">

  <h2>Join the Chill Movement 😎</h2>

  <div class="chill-grid">

    <a href="#" class="chill-box">
      <h3>🪙 Buy on Pump.fun</h3>
      <p>Where it all begins. Early vibes only.</p>
    </a>

    <a href="#" class="chill-box">
      <h3>📊 Dexscreener</h3>
      <p>Track the charts. Watch the chill rise.</p>
    </a>

    <a href="https://x.com/i/communities/2038577284320489664" target="_blank" class="chill-box">
      <h3>🐦 X Community</h3>
      <p>Join the squad. Stay updated.</p>
    </a>

    <a href="#" class="chill-box">
      <h3>💬 Telegram</h3>
      <p>Talk chill. Build together.</p>
    </a>

  </div>

</div>

<script>
let isLoading = false;

function randomTraits() {
  return {
    hat: "anime hair",
    outfit: "superhero suit",
    background: "space"
  };
}

async function generatePFP() {
  if (isLoading) return;
  isLoading = true;

  const bar = document.getElementById("loadingFill");
  bar.classList.add("active");
  bar.innerText = "chill...";

  const traits = randomTraits();

  try {
    const res = await fetch("/api/generate", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(traits)
    });

    const data = await res.json();

    bar.innerText = "DONE 😎";

    document.getElementById("pfpImage").src = data.image;
    overlay.style.display = "block";
    popup.style.display = "block";

  } catch {
    bar.innerText = "try again 😎";
  }

  setTimeout(()=>{
    bar.innerText = "Generate 😎";
    bar.classList.remove("active");
    isLoading = false;
  },1500);
}

function closePopup() {
  overlay.style.display = "none";
  popup.style.display = "none";
}

overlay.onclick = closePopup;

function downloadImage() {
  const a = document.createElement("a");
  a.href = pfpImage.src;
  a.download = "chill.png";
  a.click();
}

function shareImage() {
  window.open("https://twitter.com/intent/tweet?text=😎 Chill PFP");
}

document.addEventListener("click", (e) => {
  for (let i = 0; i < 8; i++) {
    const emoji = document.createElement("div");
    emoji.className = "emoji";
    emoji.innerText = "😎";

    const x = (Math.random()-0.5)*200 + "px";
    const y = (Math.random()-0.5)*200 + "px";

    emoji.style.left = e.clientX + "px";
    emoji.style.top = e.clientY + "px";
    emoji.style.setProperty('--x', x);
    emoji.style.setProperty('--y', y);

    document.body.appendChild(emoji);
    setTimeout(()=>emoji.remove(),1000);
  }
});
</script>

</body>
</html>
